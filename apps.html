<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta name="google" content="notranslate">
<style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
:root{
  --navy:#0A1931;
  --emerald:#00B389;
}
html, body{ margin:0; }
body{ padding-top:52px; box-sizing:border-box; }
.softpos-topbar{
  position:fixed; top:0; left:0; right:0; height:52px;
  background:#fff; border-bottom:1px solid rgba(10,25,49,.08);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; z-index:999999; box-sizing:border-box;
  direction:rtl; font-family:"Optimistic", system-ui, sans-serif;
}
.softpos-topbar .softpos-brand{
  display:flex; align-items:center; gap:8px; text-decoration:none;
}
.softpos-topbar .softpos-brand img{ height:26px; width:auto; display:block; }
.softpos-topbar .softpos-brand span{
  font-weight:800; color:var(--navy); font-size:15px; letter-spacing:.2px;
}
.softpos-back-btn{
  display:inline-flex; align-items:center; gap:6px;
  border:1.5px solid var(--navy); background:transparent; color:var(--navy);
  font-family:inherit; font-weight:700; font-size:13px;
  padding:7px 14px; border-radius:999px; cursor:pointer; text-decoration:none;
  transition:background .15s ease, color .15s ease;
}
.softpos-back-btn:hover{ background:var(--navy); color:#fff; }
.softpos-back-btn svg{ width:15px; height:15px; flex:none; }
@media(max-width:480px){
  .softpos-topbar .softpos-brand span{ display:none; }
}
